name: Export Classified current bilingual review material # dynamic-title
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/review-classified-current.yml']
permissions:
  contents: read
  actions: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python updates/v014/complete/prepare.py
      - uses: actions/download-artifact@v4
        with:
          name: COD-source-reader-v0.14-preview3
          run-id: 35362047962
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .base
      - uses: actions/download-artifact@v4
        with:
          name: v014-complete-translation-materials
          run-id: 35369692185
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: materials
      - uses: actions/download-artifact@v4
        with:
          name: v014-original-image-cache
          run-id: 35369692185
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: materials
      - run: |
          python updates/v014/complete/package.py --version-name 0.15.4 --version-code 31
          python - <<'PY'
          import json
          from pathlib import Path
          found=[]
          for p in Path('app/src/main/assets/faithful').glob('p*.js'):
              raw=p.read_text(encoding='utf-8')
              try: d=json.loads(raw[raw.index('(')+1:raw.rfind(')')])
              except Exception: continue
              if (d.get('metadata') or {}).get('title')=='Classified':
                  found.append((p,d))
          assert len(found)==1,[(str(p),(d.get('metadata') or {}).get('title')) for p,d in found]
          p,d=found[0]
          pid=int(p.stem[1:])
          print('META',json.dumps({'pageid':pid,'revision':d['metadata']['revision'],'title':d['metadata']['title'],'sourceUnitDigest':d['sourceUnitDigest'],'count':len(d['units']),'reviewed':d.get('reviewed',False)},ensure_ascii=False))
          for i,u in enumerate(d['units']):
              print('ROW',json.dumps({'i':i,'id':u['id'],'en':u['en'],'zh':u.get('zh','')},ensure_ascii=False))
          PY
