name: List packaged unreviewed fixed-revision pages # after next three quotes
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/review-classified-current.yml']
permissions:
  contents: read
  actions: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python updates/v014/complete/prepare.py
      - uses: actions/download-artifact@v4
        with:
          name: COD-source-reader-v0.14-preview3
          run-id: 35362047962
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .base
      - uses: actions/download-artifact@v4
        with:
          name: v014-complete-translation-materials
          run-id: 35369692185
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: materials
      - uses: actions/download-artifact@v4
        with:
          name: v014-original-image-cache
          run-id: 35369692185
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: materials
      - run: |
          python updates/v014/complete/package.py --version-name 0.15.4 --version-code 31
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('output/completeness.json').read_text())
          print('COMPLETENESS',json.dumps(c,ensure_ascii=False,sort_keys=True))
          out=[]
          reviewed=0
          for p in Path('app/src/main/assets/faithful').glob('p*.js'):
              raw=p.read_text(encoding='utf-8')
              try: d=json.loads(raw[raw.index('(')+1:raw.rfind(')')])
              except Exception: continue
              if d.get('reviewed'):
                  reviewed+=1
                  continue
              out.append((len(d.get('units') or []),p.stem,(d.get('metadata') or {}).get('title',''),(d.get('metadata') or {}).get('revision'),d.get('sourceUnitDigest')))
          out.sort(reverse=True)
          print('REVIEWED',reviewed)
          print('REMAINING',len(out))
          for n,stem,title,rev,digest in out:
              print('QUEUE',json.dumps({'pageid':int(stem[1:]),'units':n,'title':title,'revision':rev,'digest':digest},ensure_ascii=False))
          PY
