name: Find Revelations source
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/find-revelations-title.yml']
permissions:
  contents: read
  actions: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: COD-source-reader-v0.14-preview3
          run-id: 35362047962
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .base
      - uses: actions/download-artifact@v4
        with:
          name: cod-v0141-source-unit-drafts
          run-id: 35369694761
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .drafts
      - run: |
          python - <<'PY'
          import zipfile,json,re
          from pathlib import Path
          with zipfile.ZipFile('.base/v014-reader40-generated-sources.zip') as z:
              cand=[]
              for n in z.namelist():
                  if not re.search(r'/p\d+\.js$',n): continue
                  s=z.read(n).decode('utf-8')
                  d=json.loads(s[s.index('(')+1:s.rfind(')')])
                  title=d['metadata']['title']
                  if 'revel' in title.lower():
                      pid=int(re.search(r'p(\d+)\.js$',n).group(1))
                      cand.append((pid,title,d))
              print('CANDIDATES',[(pid,title,len(d['units'])) for pid,title,d in cand])
              assert cand, 'No Revelations-like title found'
              # Prefer exact map article over songs/other pages.
              cand.sort(key=lambda x:(x[1].lower()!='revelations', len(x[1])))
              pid,title,d=cand[0]
              review=Path(f'updates/v014/complete/reviewed/p{pid}.json')
              print('SELECTED',json.dumps({'pageid':pid,'title':title,'alreadyReviewed':review.exists()},ensure_ascii=False))
              if review.exists(): raise SystemExit(0)
              draft=json.loads(open(f'.drafts/drafts/{pid}.json',encoding='utf-8').read())
              assert len(draft['translationsInUnitOrder'])==len(d['units'])
              print('META',json.dumps({'pageid':pid,'revision':d['metadata']['revision'],'title':title,'sourceUnitDigest':d['sourceUnitDigest'],'count':len(d['units'])},ensure_ascii=False))
              for i,(u,zh) in enumerate(zip(d['units'],draft['translationsInUnitOrder'])):
                  print('ROW',json.dumps({'i':i,'id':u['id'],'en':u['en'],'zh':zh},ensure_ascii=False))
          PY
