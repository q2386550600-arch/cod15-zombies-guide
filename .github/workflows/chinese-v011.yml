name: Chinese-first guide v0.11
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'updates/v011/**'
      - '.github/workflows/chinese-v011.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: chinese-v011-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: COD-Zombies-Guide-v0.10
          run-id: 35250668068
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .base
      - name: Restore exact tested source snapshot and unchanged original images
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile
          with zipfile.ZipFile('.base/v010-generated-sources.zip') as z:
              for name in z.namelist():
                  p=Path(name)
                  if '..' in p.parts or p.is_absolute():raise ValueError('Unsafe snapshot path')
                  if p.is_file():pass
                  if name.startswith('app/src/') or name=='app/build.gradle':
                      p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(z.read(name))
          with zipfile.ZipFile('.base/COD_Zombies_Guide_v0.10.apk') as z:
              images=[n for n in z.namelist() if n.startswith('assets/images/') and not n.endswith('/')]
              assert len(images)==1148
              for name in images:
                  if '..' in Path(name).parts:raise ValueError('Unsafe image path')
                  p=Path('app/src/main')/name;p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(z.read(name))
          PY
      - name: Apply Chinese-first labels and descriptions
        run: |
          python updates/v011/apply.py
          for f in app/src/main/assets/*.js; do node --check "$f"; done
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Test Chinese language, images and existing navigation
        run: python updates/v011/test_zh.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Build with existing signing identity
        run: |
          base64 -d signing-key.b64 > debug-signing.jks
          gradle :app:assembleDebug --stacktrace
      - name: Verify output and unchanged original images
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/COD_Zombies_Guide_v0.11.apk
          /usr/local/lib/android/sdk/build-tools/35.0.0/apksigner verify --verbose --print-certs output/COD_Zombies_Guide_v0.11.apk | tee output/signature.txt
          sha256sum output/COD_Zombies_Guide_v0.11.apk > output/SHA256SUMS.txt
          cp test-results/chinese-tests.json output/
          python - <<'PY'
          import zipfile,json
          from pathlib import Path
          with zipfile.ZipFile('.base/COD_Zombies_Guide_v0.10.apk') as a,zipfile.ZipFile('output/COD_Zombies_Guide_v0.11.apk') as b:
              assert b.testzip() is None
              images=[n for n in a.namelist() if n.startswith('assets/images/')]
              assert len(images)==1148
              assert all(a.read(n)==b.read(n) for n in images)
          Path('output/image-check.json').write_text(json.dumps({'unchangedOriginalImages':len(images),'zipIntegrity':True}))
          with zipfile.ZipFile('output/v011-generated-sources.zip','w',zipfile.ZIP_DEFLATED) as z:
              for p in list(Path('app/src').rglob('*'))+[Path('app/build.gradle')]:
                  if p.is_file() and '/images/' not in str(p):z.write(p,str(p))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: COD-Zombies-Guide-v0.11
          path: output/
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v0.11-browser-tests
          path: test-results/
          retention-days: 14
          if-no-files-found: warn
  android:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: COD-Zombies-Guide-v0.11
          path: output
      - uses: actions/download-artifact@v4
        with:
          name: COD-Zombies-Guide-v0.10
          run-id: 35250668068
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .base
      - run: python -m pip install websocket-client==1.8.0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify native Chinese interface and in-place upgrade
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          disable-animations: true
          script: python updates/v011/native_test.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v0.11-Android16-verification
          path: android-test-results/
          retention-days: 14
          if-no-files-found: warn
