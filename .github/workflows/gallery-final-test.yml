name: Final v0.10 Android 16 verification
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['ci/gallery_final_test.py','.github/workflows/gallery-final-test.yml']
permissions:
  contents: read
  actions: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: COD-Zombies-Guide-v0.10
          run-id: 35250668068
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: output
      - uses: actions/download-artifact@v4
        with:
          name: COD-Zombies-Guide-v0.9
          run-id: 35243532933
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: old
      - run: python -m pip install websocket-client==1.8.0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify the unchanged final APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          disable-animations: true
          script: python ci/gallery_final_test.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v0.10-final-Android16-verification
          path: android-test-results/
          retention-days: 14
          if-no-files-found: warn
