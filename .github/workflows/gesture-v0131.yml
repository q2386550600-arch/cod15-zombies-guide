name: Gesture-only hotfix v0.13.1
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['updates/v0131/**', '.github/workflows/gesture-v0131.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: gesture-v0131
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: COD-Zombies-Guide-v0.13
          run-id: 35284339967
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .base
      - name: Restore exact delivered source and assets
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile
          with zipfile.ZipFile('.base/v013-generated-sources.zip') as z:
              for n in z.namelist():
                  p=Path(n)
                  if p.is_absolute() or '..' in p.parts:raise ValueError('Unsafe path')
                  if n.startswith('app/src/') or n=='app/build.gradle':
                      p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(z.read(n))
          with zipfile.ZipFile('.base/COD_Zombies_Guide_v0.13.apk') as z:
              for n in z.namelist():
                  if n.startswith('assets/') and not n.endswith('/'):
                      if '..' in Path(n).parts:raise ValueError('Unsafe asset')
                      p=Path('app/src/main')/n;p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(z.read(n))
          PY
          python updates/v0131/apply.py
          node --check app/src/main/assets/v0131.js
      - name: Browser gesture checks
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          python updates/v0131/test_browser.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile and sign
        run: |
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"
          base64 -d signing-key.b64 > debug-signing.jks
          gradle :app:assembleDebug --stacktrace
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/COD_Zombies_Guide_v0.13.1.apk
          /usr/local/lib/android/sdk/build-tools/35.0.0/apksigner verify --verbose --print-certs output/COD_Zombies_Guide_v0.13.1.apk > output/signature.txt
          sha256sum output/COD_Zombies_Guide_v0.13.1.apk > output/SHA256SUMS.txt
      - name: Prove all previous content and media unchanged
        run: |
          python - <<'PY'
          import zipfile,json
          from pathlib import Path
          with zipfile.ZipFile('.base/COD_Zombies_Guide_v0.13.apk') as a,zipfile.ZipFile('output/COD_Zombies_Guide_v0.13.1.apk') as b:
              assert b.testzip() is None
              old=[n for n in a.namelist() if n.startswith('assets/') and n!='assets/index.html' and not n.endswith('/')]
              assert all(a.read(n)==b.read(n) for n in old)
              assert a.read('assets/offline-guides.js')==b.read('assets/offline-guides.js')
          Path('output/content-unchanged.json').write_text(json.dumps({'unchangedExistingAssets':len(old),'guideTextUnchanged':True,'originalScreenshots':1148,'floorPlans':134,'scope':'Gesture fix only; no full-source translation added.'},indent=2))
          with zipfile.ZipFile('output/v0131-generated-sources.zip','w',zipfile.ZIP_DEFLATED) as z:
              for p in list(Path('app/src').rglob('*'))+[Path('app/build.gradle')]:
                  if p.is_file() and '/images/' not in str(p) and '/atlas/' not in str(p):z.write(p,str(p))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: COD-Zombies-Guide-v0.13.1
          path: output/
          compression-level: 0
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v0.13.1-browser-tests
          path: test-results/
  android:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: COD-Zombies-Guide-v0.13.1
          path: output
      - uses: actions/download-artifact@v4
        with:
          name: COD-Zombies-Guide-v0.13
          run-id: 35284339967
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .base
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: |
          python -m pip install websocket-client==1.8.0
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          disable-animations: true
          script: python updates/v0131/test_native.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v0.13.1-Android16-gestures
          path: android-test-results/
          retention-days: 14
