name: Verify Chinese-first APK on Android 16
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ci/verify_chinese_v011.py'
      - '.github/workflows/chinese-final-test.yml'
permissions:
  contents: read
  actions: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: COD-Zombies-Guide-v0.11
          run-id: 35254515299
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: output
      - uses: actions/download-artifact@v4
        with:
          name: COD-Zombies-Guide-v0.10
          run-id: 35250668068
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .base
      - run: python -m pip install websocket-client==1.8.0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify Chinese labels, native image controls and update retention
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          disable-animations: true
          script: python ci/verify_chinese_v011.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v0.11-final-native-verification
          path: android-test-results/
          retention-days: 14
          if-no-files-found: warn
