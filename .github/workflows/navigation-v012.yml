name: Navigation and source detail v0.12
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['updates/v012/**', '.github/workflows/navigation-v012.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: navigation-v012-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: COD-Zombies-Guide-v0.11
          run-id: 35254515299
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .base
      - uses: actions/download-artifact@v4
        with:
          name: v012-community-atlas-review
          run-id: 35257887867
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .atlas
      - uses: actions/download-artifact@v4
        with:
          name: original-community-source-pack
          run-id: 35232916091
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .source
      - name: Restore tested v0.11 source and unchanged original pictures
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile
          with zipfile.ZipFile('.base/v011-generated-sources.zip') as z:
              for n in z.namelist():
                  p=Path(n)
                  if p.is_absolute() or '..' in p.parts:raise ValueError('Unsafe path')
                  if n.startswith('app/src/') or n=='app/build.gradle':
                      p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(z.read(n))
          with zipfile.ZipFile('.base/COD_Zombies_Guide_v0.11.apk') as z:
              images=[n for n in z.namelist() if n.startswith('assets/images/') and not n.endswith('/')]
              assert len(images)==1148
              for n in images:
                  p=Path('app/src/main')/n;p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(z.read(n))
          PY
      - name: Apply navigation, locations and publisher reader
        run: |
          python updates/v012/apply.py
          python updates/v012/prepare_data.py --atlas .atlas --source .source --assets app/src/main/assets
          for f in app/src/main/assets/*.js; do node --check "$f"; done
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Test maps, chapter coverage and whole-page gestures
        run: python updates/v012/test_navigation.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install SDK and compile with existing signing identity
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          base64 -d signing-key.b64 > debug-signing.jks
          gradle :app:assembleDebug --stacktrace
      - name: Verify delivered APK and original media
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/COD_Zombies_Guide_v0.12.apk
          /usr/local/lib/android/sdk/build-tools/35.0.0/apksigner verify --verbose --print-certs output/COD_Zombies_Guide_v0.12.apk | tee output/signature.txt
          sha256sum output/COD_Zombies_Guide_v0.12.apk > output/SHA256SUMS.txt
          cp app/src/main/assets/navigation-audit.json test-results/navigation-tests.json output/
          python - <<'PY'
          import zipfile,json,hashlib
          from pathlib import Path
          with zipfile.ZipFile('.base/COD_Zombies_Guide_v0.11.apk') as a,zipfile.ZipFile('output/COD_Zombies_Guide_v0.12.apk') as b:
              assert b.testzip() is None
              pictures=[n for n in a.namelist() if n.startswith('assets/images/') and not n.endswith('/')]
              assert len(pictures)==1148 and all(a.read(n)==b.read(n) for n in pictures)
              atlas=[n for n in b.namelist() if n.startswith('assets/atlas/') and not n.endswith('/')]
              assert len(atlas)==134
          Path('output/media-verification.json').write_text(json.dumps({'unchangedSourcePictures':1148,'addedCommunityPlans':134,'apkZipValid':True}))
          with zipfile.ZipFile('output/v012-generated-sources.zip','w',zipfile.ZIP_DEFLATED) as z:
              for p in list(Path('app/src').rglob('*'))+[Path('app/build.gradle')]:
                  if p.is_file() and '/images/' not in str(p) and '/atlas/' not in str(p):z.write(p,str(p))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: COD-Zombies-Guide-v0.12
          path: output/
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v0.12-browser-tests
          path: test-results/
          retention-days: 14
  android:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: COD-Zombies-Guide-v0.12
          path: output
      - uses: actions/download-artifact@v4
        with:
          name: COD-Zombies-Guide-v0.11
          run-id: 35254515299
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .base
      - run: python -m pip install websocket-client==1.8.0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify upgrade and page-wide native gestures
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          disable-animations: true
          script: python updates/v012/native_test.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v0.12-Android16-verification
          path: android-test-results/
          retention-days: 14
