name: Build and verify image viewer v0.10
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'updates/v010/**'
      - '.github/workflows/gallery-v010.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: gallery-v010-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Apply versioned gallery update
        run: python updates/v010/apply.py
      - uses: actions/download-artifact@v4
        with:
          name: original-community-source-pack
          run-id: 35232916091
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .source
      - uses: actions/download-artifact@v4
        with:
          name: original-community-images
          run-id: 35232916091
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .media
      - name: Verify all original images and prepare offline assets
        run: python tools/prepare_media.py --source .source --media .media --assets app/src/main/assets
      - name: Validate JavaScript, map registry and description coverage
        run: |
          for file in app/src/main/assets/*.js; do node --check "$file"; done
          node - <<'JS'
          const fs=require('fs'),vm=require('vm');global.window=global;
          const base='app/src/main/assets/';
          for(const f of ['data.js','bo1-data.js','bo2-data.js','bo3-data.js','games.js','media.js','v09-fixes.js','image-help.js'])vm.runInThisContext(fs.readFileSync(base+f,'utf8'),{filename:f});
          if(Object.keys(ZOMBIE_DATA).length!==41)throw Error('Map registry mismatch');
          if(COMMUNITY_MEDIA.uniqueImages!==1148||COMMUNITY_MEDIA.references!==1170)throw Error('Media inventory mismatch');
          for(const [key,doc] of Object.entries(COMMUNITY_MEDIA.guides))for(const p of doc.images){
            if(!fs.existsSync(base+p.file))throw Error('Missing '+p.file);
            const rules=(IMAGE_HELP.notes[key]||[]).filter(r=>p.index>=r.first&&p.index<=r.last);
            if(rules.length!==1||!rules[0].action)throw Error('Missing or ambiguous context '+key+':'+p.index);
          }
          console.log('41 maps, 1148 unchanged original images, all 1170 image references retain context.');
          JS
      - name: Install browser regression-test dependencies
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Test original tutorial behavior and new image browser
        run: |
          python tests/test_ui.py
          python updates/v010/test_gallery.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Restore existing test signing key
        run: base64 -d signing-key.b64 > debug-signing.jks
      - name: Compile normal Android APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Verify signature, ZIP and package output
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/COD_Zombies_Guide_v0.10.apk
          /usr/local/lib/android/sdk/build-tools/35.0.0/apksigner verify --verbose --print-certs output/COD_Zombies_Guide_v0.10.apk | tee output/signature.txt
          unzip -t output/COD_Zombies_Guide_v0.10.apk > output/zip-integrity.txt
          sha256sum output/COD_Zombies_Guide_v0.10.apk > output/SHA256SUMS.txt
          cp app/src/main/assets/media-audit.json output/
          cp test-results/gallery-tests.json output/
          python - <<'PY'
          from pathlib import Path
          import zipfile
          paths=list(Path('app/src').rglob('*'))+[Path('app/build.gradle')]
          with zipfile.ZipFile('output/v010-generated-sources.zip','w',zipfile.ZIP_DEFLATED) as z:
              for p in paths:
                  if p.is_file() and '/images/' not in str(p):z.write(p,str(p))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: COD-Zombies-Guide-v0.10
          path: output/
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v0.10-browser-tests
          path: test-results/
          retention-days: 14
          if-no-files-found: warn
  android:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: COD-Zombies-Guide-v0.10
          path: output
      - uses: actions/download-artifact@v4
        with:
          name: COD-Zombies-Guide-v0.9
          run-id: 35243532933
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: old
      - name: Prepare upgrade and native gesture tests
        run: |
          python updates/v010/prepare_native.py
          python -m pip install websocket-client==1.8.0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify upgrade, proportions and native previous-next-swipe on Android 16
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          disable-animations: true
          script: python ci/native_v010.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v0.10-Android16-runtime-test
          path: android-test-results/
          retention-days: 14
          if-no-files-found: warn
