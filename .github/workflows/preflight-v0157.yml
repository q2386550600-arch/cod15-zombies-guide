name: Preflight v0.15.7 review counts
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/preflight-v0157.yml']
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python updates/v014/complete/prepare.py
      - uses: actions/download-artifact@v4
        with:
          name: COD-source-reader-v0.14-preview3
          run-id: 35362047962
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .base
      - uses: actions/download-artifact@v4
        with:
          name: v014-complete-translation-materials
          run-id: 35369692185
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: materials
      - uses: actions/download-artifact@v4
        with:
          name: v014-original-image-cache
          run-id: 35369692185
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: materials
      - run: |
          python updates/v014/complete/package.py --version-name 0.15.7 --version-code 34
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('output/completeness.json').read_text())
          print('COMPLETENESS',json.dumps(c,ensure_ascii=False,sort_keys=True))
          PY
