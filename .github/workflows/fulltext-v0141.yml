name: COD full source continuation v0.14.1
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/fulltext-v0141.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: cod-full-source-v0141
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify and restore reviewed source checkpoint and matching tests
        run: |
          python updates/v0141/unpack_payload.py
          python updates/v014/continue40/prepare.py
      - uses: actions/download-artifact@v4
        with:
          name: COD-source-reader-v0.14-preview3
          run-id: 35362047962
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .previous
      - uses: actions/download-artifact@v4
        with:
          name: cod-v0141-source-unit-drafts
          run-id: 35369694761
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .drafts
      - name: Restore actual previous app and merge source-unit-bound Chinese text
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile
          with zipfile.ZipFile('.previous/v014-reader40-generated-sources.zip') as z:
              for n in z.namelist():
                  p=Path(n)
                  assert not p.is_absolute() and '..' not in p.parts
                  if n.startswith('app/src/') or n=='app/build.gradle':
                      p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(z.read(n))
          with zipfile.ZipFile('.previous/COD_Zombies_Guide_v0.14.0-preview3.apk') as z:
              for n in z.namelist():
                  if n.startswith('assets/') and not n.endswith('/'):
                      assert '..' not in Path(n).parts
                      p=Path('app/src/main')/n;p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(z.read(n))
          PY
          python updates/v0141/draft_qa.py
          python updates/v0141/integrate.py
          python updates/v0141/prepare_tests.py
          python updates/v0141/finalize_tests.py
          node --check app/src/main/assets/faithful.js
          node --check app/src/main/assets/entry-faithful.js
          python -m py_compile updates/v0141/native_complete.py
      - name: Install browser regression environment
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Test every source unit, table, media reference and review-state distinction
        run: python updates/v0141/test_complete.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build signed APK with existing application identity
        run: |
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"
          base64 -d signing-key.b64 > debug-signing.jks
          gradle :app:assembleDebug --stacktrace
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/COD_Zombies_Guide_v0.14.1.apk
          /usr/local/lib/android/sdk/build-tools/35.0.0/apksigner verify --verbose --print-certs output/COD_Zombies_Guide_v0.14.1.apk > output/signature.txt
          /usr/local/lib/android/sdk/build-tools/35.0.0/apksigner verify --print-certs .previous/COD_Zombies_Guide_v0.14.0-preview3.apk > output/previous-signature.txt
          python updates/v0141/package_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: COD-Zombies-Guide-v0.14.1
          path: output/
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cod-v0141-browser-evidence
          path: |
            test-results/
            updates/v0141/content-integrity.json
            .drafts/targeted-qa.json
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: warn
  android:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Restore corresponding native regression tests
        run: |
          python updates/v0141/unpack_payload.py
          python updates/v014/continue40/prepare.py
          python updates/v0141/prepare_tests.py
      - uses: actions/download-artifact@v4
        with:
          name: COD-Zombies-Guide-v0.14.1
          path: output
      - uses: actions/download-artifact@v4
        with:
          name: COD-source-reader-v0.14-preview3
          run-id: 35362047962
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .previous
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare emulator runtime
        run: |
          python -m pip install websocket-client==1.8.0
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          disable-animations: true
          script: python updates/v0141/native_complete.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cod-v0141-native-evidence
          path: android-test-results/
          retention-days: 30
          if-no-files-found: error
