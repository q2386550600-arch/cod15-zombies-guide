name: Export Classified IX Voyage review material
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/review-classified-ix-voyage.yml']
permissions:
  contents: read
  actions: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: COD-source-reader-v0.14-preview3
          run-id: 35362047962
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .base
      - uses: actions/download-artifact@v4
        with:
          name: cod-v0141-source-unit-drafts
          run-id: 35369694761
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .drafts
      - run: |
          python - <<'PY'
          import zipfile,json,re
          from pathlib import Path
          wanted={'Classified','IX','Voyage of Despair'}
          seen=[]
          with zipfile.ZipFile('.base/v014-reader40-generated-sources.zip') as z:
              for n in z.namelist():
                  m=re.search(r'/p(\d+)\.js$',n)
                  if not m: continue
                  s=z.read(n).decode('utf-8')
                  d=json.loads(s[s.index('(')+1:s.rfind(')')])
                  title=d['metadata']['title']
                  if title not in wanted: continue
                  pid=int(m.group(1)); seen.append(title)
                  review=Path(f'updates/v014/complete/reviewed/p{pid}.json')
                  print('STATUS',json.dumps({'pageid':pid,'title':title,'alreadyReviewed':review.exists()},ensure_ascii=False))
                  if review.exists(): continue
                  draft=json.loads(open(f'.drafts/drafts/{pid}.json',encoding='utf-8').read())
                  assert len(draft['translationsInUnitOrder'])==len(d['units'])
                  print('META',json.dumps({'pageid':pid,'revision':d['metadata']['revision'],'title':title,'sourceUnitDigest':d['sourceUnitDigest'],'count':len(d['units'])},ensure_ascii=False))
                  for i,(u,zh) in enumerate(zip(d['units'],draft['translationsInUnitOrder'])):
                      print('ROW',json.dumps({'pid':pid,'i':i,'id':u['id'],'en':u['en'],'zh':zh},ensure_ascii=False))
          assert set(seen)==wanted,(seen,wanted)
          PY
