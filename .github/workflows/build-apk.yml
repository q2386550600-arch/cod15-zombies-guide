name: Build focused Android guide v0.9
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'tools/**'
      - 'tests/**'
      - '.github/workflows/build-apk.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: guide-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: original-community-source-pack
          run-id: 35232916091
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .source
      - uses: actions/download-artifact@v4
        with:
          name: original-community-images
          run-id: 35232916091
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .media
      - name: Verify every original image and prepare offline assets
        run: python tools/prepare_media.py --source .source --media .media --assets app/src/main/assets
      - name: Validate all JavaScript and map registry
        run: |
          for file in app/src/main/assets/*.js; do node --check "$file"; done
          node - <<'JS'
          const fs=require('fs'),vm=require('vm');global.window=global;
          const base='app/src/main/assets/';
          for(const f of ['data.js','bo1-data.js','bo2-data.js','bo3-data.js','games.js','media.js','v09-fixes.js'])vm.runInThisContext(fs.readFileSync(base+f,'utf8'),{filename:f});
          if(Object.keys(ZOMBIE_DATA).length!==41)throw Error('Map registry mismatch');
          if(COMMUNITY_MEDIA.uniqueImages!==1148||COMMUNITY_MEDIA.references!==1170)throw Error('Media inventory mismatch');
          for(const d of Object.values(COMMUNITY_MEDIA.guides))for(const p of d.images)if(!fs.existsSync(base+p.file))throw Error('Missing '+p.file);
          console.log('41 maps; 22 source articles; 1170 references; 1148 verified original images');
          JS
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Test focused tutorial, all maps, image gallery and persistence
        run: python tests/test_ui.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Restore existing test signing key
        run: base64 -d signing-key.b64 > debug-signing.jks
      - name: Compile Android APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Verify and package output
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/COD_Zombies_Guide_v0.9.apk
          /usr/local/lib/android/sdk/build-tools/35.0.0/apksigner verify --verbose --print-certs output/COD_Zombies_Guide_v0.9.apk | tee output/signature.txt
          unzip -t output/COD_Zombies_Guide_v0.9.apk > output/zip-integrity.txt
          sha256sum output/COD_Zombies_Guide_v0.9.apk > output/SHA256SUMS.txt
          cp app/src/main/assets/media-audit.json output/
      - uses: actions/upload-artifact@v4
        with:
          name: COD-Zombies-Guide-v0.9
          path: output/
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v0.9-interaction-tests
          path: test-results/
          retention-days: 14
          if-no-files-found: warn
