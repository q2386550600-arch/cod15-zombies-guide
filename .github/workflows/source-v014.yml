name: Collect complete licensed source pages v0.14
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['updates/v014/collect_api.py', '.github/workflows/source-v014.yml']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python -m pip install requests beautifulsoup4
      - name: Fetch complete wiki API pages and fixed-revision source text
        run: python updates/v014/collect_api.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v014-complete-source-review
          path: source-archive/
          retention-days: 30
          if-no-files-found: error
