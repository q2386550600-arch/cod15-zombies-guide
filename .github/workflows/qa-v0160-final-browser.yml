name: QA v0.16.0 final browser
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/qa-v0160-final-browser.yml']
permissions:
  contents: read
  actions: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: |
          python updates/v014/complete/prepare.py
          python updates/v014/complete/test_fixes.py
          python updates/review_count_tests.py --reviewed 182 --drafts 0 --extra-ids 677446,638578
      - uses: actions/download-artifact@v4
        with:
          name: COD-Zombies-Guide-v0.16.0-review182
          run-id: 35426567985
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: output
      - name: Test exact delivered v0.16.0 APK assets
        run: |
          python - <<'PY'
          import zipfile,json,hashlib
          from pathlib import Path
          m=json.loads(Path('output/build-manifest.json').read_text())
          p=Path('output/COD_Zombies_Guide_v0.16.0.apk')
          assert hashlib.sha256(p.read_bytes()).hexdigest()==m['sha256']
          assert m['reviewedArticles']==182
          assert m['automaticDraftArticles']==0
          assert m['reviewedUnits']==54189
          with zipfile.ZipFile(p) as z:
              for n in z.namelist():
                  if n.startswith('assets/') and not n.endswith('/'):
                      q=Path('app/src/main')/n
                      q.parent.mkdir(parents=True,exist_ok=True)
                      q.write_bytes(z.read(n))
          PY
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
          python updates/v014/complete/browser_test.py
          python updates/v014/complete/feature_test.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v0160-final-browser-qa
          path: test-results/
          retention-days: 30
