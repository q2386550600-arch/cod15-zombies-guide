name: Complete corpus translation and offline materials
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/complete-materials-v014.yml']
permissions:
  contents: read
  actions: read
jobs:
  materials:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: COD-source-reader-v0.14-preview3
          run-id: 35362047962
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .base
      - run: python -m pip install requests Pillow
      - name: Translate every remaining source unit without summarizing or approving and preserve original-size media
        run: python -u updates/v014/complete/materials.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v014-complete-translation-materials
          path: |
            completion/translation-materials.zip
            completion/translation-checkpoint.jsonl
            completion/translation-cache.json
            completion/translation-errors.json
            completion/materials-summary.json
            completion/media-audit.json
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v014-original-image-cache
          path: |
            completion/original-image-cache.zip
            completion/media-checkpoints/
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
