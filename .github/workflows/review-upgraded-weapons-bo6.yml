name: Export BO6 upgraded weapons review material
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/review-upgraded-weapons-bo6.yml']
permissions:
  contents: read
  actions: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: COD-source-reader-v0.14-preview3
          run-id: 35362047962
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .base
      - uses: actions/download-artifact@v4
        with:
          name: cod-v0141-source-unit-drafts
          run-id: 35369694761
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .drafts
      - run: |
          python - <<'PY'
          import zipfile,json,re
          wanted='Upgraded Weapons/Black Ops 6'
          found=[]
          with zipfile.ZipFile('.base/v014-reader40-generated-sources.zip') as z:
              for n in z.namelist():
                  m=re.search(r'/p(\d+)\.js$',n)
                  if not m: continue
                  raw=z.read(n).decode('utf-8')
                  d=json.loads(raw[raw.index('(')+1:raw.rfind(')')])
                  if d['metadata']['title']!=wanted: continue
                  pid=int(m.group(1)); found.append(pid)
                  draft=json.loads(open(f'.drafts/drafts/{pid}.json',encoding='utf-8').read())
                  assert len(draft['translationsInUnitOrder'])==len(d['units'])
                  print('META',json.dumps({'pageid':pid,'revision':d['metadata']['revision'],'title':wanted,'sourceUnitDigest':d['sourceUnitDigest'],'count':len(d['units'])},ensure_ascii=False))
                  for i,(u,zh) in enumerate(zip(d['units'],draft['translationsInUnitOrder'])):
                      print('ROW',json.dumps({'i':i,'id':u['id'],'en':u['en'],'zh':zh},ensure_ascii=False))
          assert len(found)==1,found
          PY
