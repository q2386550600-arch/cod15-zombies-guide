name: Diagnose review source bindings
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/diagnose-review-bindings.yml']
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: COD-source-reader-v0.14-preview3
          run-id: 35362047962
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .base
      - run: |
          python - <<'PY'
          import zipfile,json,re
          from pathlib import Path
          docs={}
          with zipfile.ZipFile('.base/v014-reader40-generated-sources.zip') as z:
            for n in z.namelist():
              m=re.search(r'/p(\d+)\.js$',n)
              if not m: continue
              raw=z.read(n).decode('utf-8')
              d=json.loads(raw[raw.index('(')+1:raw.rfind(')')])
              docs[int(m.group(1))]=d
          mism=[]
          missing=[]
          for p in Path('updates/v014/complete/reviewed').glob('p*.json'):
            r=json.loads(p.read_text())
            pid=int(r['pageid'])
            d=docs.get(pid)
            if not d:
              missing.append({'file':str(p),'pageid':pid})
              continue
            okrev=r['revision']==d['metadata']['revision']
            okdig=r['sourceUnitDigest']==d['sourceUnitDigest']
            okcount=r.get('sourceUnitCount')==len(d['units'])
            if not (okrev and okdig and okcount):
              mism.append({'file':str(p),'pageid':pid,'title':d['metadata']['title'],
                'reviewRev':r['revision'],'sourceRev':d['metadata']['revision'],
                'reviewDigest':r['sourceUnitDigest'],'sourceDigest':d['sourceUnitDigest'],
                'reviewCount':r.get('sourceUnitCount'),'sourceCount':len(d['units'])})
          print('REVIEW_FILES',sum(1 for _ in Path('updates/v014/complete/reviewed').glob('p*.json')))
          print('MISMATCH_COUNT',len(mism))
          for x in mism: print('MISMATCH',json.dumps(x,ensure_ascii=False))
          for x in missing: print('MISSING',json.dumps(x,ensure_ascii=False))
          PY
