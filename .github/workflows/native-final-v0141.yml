name: Final Android verification of unchanged v0.14.1 APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/native-final-v0141.yml']
permissions:
  contents: read
  actions: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare upgrade and offline tests without changing the APK
        run: |
          python updates/v0141/unpack_payload.py
          python updates/v014/continue40/prepare.py
          python updates/v0141/prepare_tests.py
          python updates/v0141/extra_upgrade_checks.py
          python updates/v0141/finalize_tests.py
          python -m py_compile updates/v0141/native_complete.py
      - name: Wait for this continuation build artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json,os,time,urllib.request
          base='https://api.github.com/repos/q2386550600-arch/cod15-zombies-guide/actions/runs/35372980741'
          def get(suffix):
              req=urllib.request.Request(base+suffix,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req,timeout=30) as r:return json.load(r)
          for _ in range(60):
              if any(a['name']=='COD-Zombies-Guide-v0.14.1' for a in get('/artifacts')['artifacts']):break
              jobs=get('/jobs')['jobs'];build=next((j for j in jobs if j['name']=='build'),None)
              if build and build['status']=='completed' and build['conclusion']!='success':raise RuntimeError('The source build failed; do not test a substitute APK')
              time.sleep(10)
          else:raise TimeoutError('No current-build artifact within 10 minutes')
          PY
      - uses: actions/download-artifact@v4
        with:
          name: COD-Zombies-Guide-v0.14.1
          run-id: 35372980741
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: output
      - uses: actions/download-artifact@v4
        with:
          name: COD-source-reader-v0.14-preview3
          run-id: 35362047962
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .previous
      - name: Verify exact build identity
        run: |
          python - <<'PY'
          import hashlib,json,pathlib
          p=pathlib.Path('output/COD_Zombies_Guide_v0.14.1.apk');r=json.loads(pathlib.Path('output/build-verification.json').read_text())
          assert hashlib.sha256(p.read_bytes()).hexdigest()==r['sha256']
          assert r['version']=='0.14.1' and r['sameSigningCertificate']
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare emulator runtime
        run: |
          python -m pip install websocket-client==1.8.0
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          disable-animations: true
          script: python updates/v0141/native_complete.py
      - name: Bind test evidence to the unchanged APK and test revision
        if: always()
        run: |
          mkdir -p android-test-results/test-code
          cp updates/v0141/native_complete.py updates/v0141/extra_upgrade_checks.py ci/android_runtime_cdp.py android-test-results/test-code/
          printf '%s\n' '${{ github.sha }}' > android-test-results/test-commit.txt
          printf '%s\n' '35372980741' > android-test-results/apk-build-run.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cod-v0141-final-native-evidence
          path: android-test-results/
          retention-days: 30
          if-no-files-found: error
