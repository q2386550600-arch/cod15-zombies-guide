<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>COD15 僵尸彩蛋助手</title><style>body{margin:0;background:#0f1113;color:#f4f5f6;font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.app{max-width:680px;margin:auto;padding:16px}.tabs{display:flex;gap:8px;overflow:auto;margin:12px 0}.tabs button,.actions button{border:1px solid #343a40;background:#1a1e22;color:#fff;border-radius:12px;padding:10px 12px}.tabs button.active,.actions .primary{border-color:#f3c14b;color:#111;background:#f3c14b}.card{background:#171a1e;border:1px solid #30363d;border-radius:18px;padding:16px;margin-top:12px}.muted{color:#a9b0b8;font-size:13px}.place{color:#f3c14b;margin:8px 0}.block{background:#20242a;border-radius:12px;padding:12px;margin-top:10px;line-height:1.6}.actions{display:grid;grid-template-columns:1fr 1.4fr;gap:10px;margin-top:14px}.list button{display:block;width:100%;text-align:left;background:transparent;border:0;color:#ddd;padding:10px 0;border-bottom:1px solid #30363d}.done{color:#70d69a!important}</style></head><body><main class="app"><h2>COD15 僵尸彩蛋助手</h2><div class="muted">离线版 · 一次只看当前一步</div><div class="tabs" id="tabs"></div><div class="card"><div class="muted" id="counter"></div><h2 id="title"></h2><div class="place" id="place"></div><div class="block" id="action"></div><div class="block"><b>成功标志</b><br><span id="success"></span></div><div class="block"><b>提示</b><br><span id="tips"></span></div><div class="actions"><button id="prev">上一步</button><button id="next" class="primary">完成这一步 →</button></div></div><div class="card"><b>本局流程</b><div class="list" id="list"></div></div></main><script>const D={alpha:{n:'阿尔法·欧米伽',s:[['恢复地面电力','发电站','拉下总电闸并清掉电狗。','地图恢复供电。','先只做供电。'],['地下通风封锁','地下发电机室','进入地下启动通风控制台并撑过封锁。','封锁结束。','AI可能卡路。'],['修4台通风机','地面建筑外侧','找冒绿气的坏通风机并修满4台。','强化机恢复。','绿色表针的不用修。'],['启动绿色电脑','作战室一楼','和绿色屏幕电脑互动。','电脑开始讲话。','正常在线模式。'],['读取电视代码','地下卧室区','买电拳套，在雪花电视旁用电拳套击杀僵尸，再互动电视记录字母+时间。','得到多组代码。','不要自己重排代码。'],['调时钟','地面各房屋','按字母把对应房屋的钟调到电视给出的时间。','最后未指定的钟自动转动。','记下最后4位时间。'],['输入密码','作战室绿色电脑','输入最后一只钟停下的4位时间。','电脑接受密码。','错了就重新核对。']]},tag:{n:'亡灵节',s:[['开两处电源','码头 + 沉船主控室','先开码头电，再上沉船主控室开第二处电。','两处供电开启。','第二处在船最上层主控室。'],['拿蓝石交隐士','灯塔洞穴 → 灯塔顶','打下蓝色发光石，捡起后带到灯塔顶升降板。','隐士收走蓝石。','拿到后直接上灯塔。'],['修两条滑索','船头 + 船尾','找到两只曲柄并修好两处滑索。','灯塔顶可拿滑索把手。','曲柄有随机点。'],['上山顶基地','山顶基地','用滑索上山顶基地并开电。','山顶区域开放。','主线关键前置。'],['完成两座图腾','任意两座图腾','每座做完3个挑战。','隐士给4个转盘。','图腾像士兵假人。']]},blood:{n:'亡者之血',s:[['基础前置','全图','开两处电、做幽灵盾并解锁强化机。','盾和强化机都可用。','后续大量依赖幽灵盾。'],['拿地狱投掷物与勺子','全图','喂满3个狗头并取得勺子。','两件关键道具到手。','没有勺子无法继续。'],['开典狱长秘密房','典狱长之家二楼','18回合后用勺子打墙，并让典狱长攻击该墙。','秘密房打开。','别提前杀典狱长。'],['追幽灵鸟','全图','前三次用盾冲击赶鸟，第4次不要直接冲击。','进入第4次抓鸟。','用盾观察最稳。']]},classified:{n:'机密',s:[['先确认主线性质','整张地图','机密没有传统解谜主线；主结局条件是活到150回合。','150回合自动播放结局。','拿钥匙开抽屉不是传统主线。'],['开电和强化机','作战室 / 实验区 / 51区','按正常流程开电并解锁强化机。','强化机可使用。','这是高回合准备。'],['准备高回合配置','全图','拿高回合武器、特长和生存配置。','能稳定清怪。','稳定比解谜重要。'],['冲150回合','稳定刷怪点','持续生存到150回合。','触发结局动画。','耗时很长。']]}};const order=['alpha','tag','blood','classified'];let k='alpha',i=0;const done={};order.forEach(x=>done[x]=new Set());const $=x=>document.getElementById(x);function render(){const m=D[k],s=m.s[i];$('tabs').innerHTML='';order.forEach(x=>{const b=document.createElement('button');b.textContent=D[x].n;b.className=x===k?'active':'';b.onclick=()=>{k=x;i=0;render()};$('tabs').appendChild(b)});$('counter').textContent=`第 ${i+1} / ${m.s.length} 步`;$('title').textContent=s[0];$('place').textContent='地点：'+s[1];$('action').textContent=s[2];$('success').textContent=s[3];$('tips').textContent=s[4];$('prev').disabled=i===0;$('next').textContent=i===m.s.length-1?'标记完成':'完成这一步 →';$('list').innerHTML='';m.s.forEach((x,j)=>{const b=document.createElement('button');b.textContent=`${j+1}. ${x[0]}`;if(done[k].has(j))b.className='done';b.onclick=()=>{i=j;render()};$('list').appendChild(b)})}$('prev').onclick=()=>{if(i>0){i--;render()}};$('next').onclick=()=>{done[k].add(i);if(i<D[k].s.length-1)i++;render()};render();</script></body></html>
