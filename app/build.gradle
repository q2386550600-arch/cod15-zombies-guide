plugins {
    id 'com.android.application'
}

android {
    namespace 'com.openai.cod15guide'
    compileSdk 35

    defaultConfig {
        applicationId 'com.openai.cod15guide'
        minSdk 24
        targetSdk 35
        versionCode 5
        versionName '0.5'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
