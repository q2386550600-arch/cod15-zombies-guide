plugins {
    id 'com.android.application'
}

android {
    namespace 'com.openai.cod15guide'
    compileSdk 35

    signingConfigs {
        guide {
            storeFile rootProject.file('debug-signing.jks')
            storePassword 'bo4guide'
            keyAlias 'bo4guide'
            keyPassword 'bo4guide'
        }
    }

    defaultConfig {
        applicationId 'com.openai.cod15guide'
        minSdk 24
        targetSdk 35
        versionCode 6
        versionName '0.6'
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.guide
        }
        release {
            signingConfig signingConfigs.guide
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
